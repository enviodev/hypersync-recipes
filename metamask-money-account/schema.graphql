type Totals {
  id: ID! # "monad"
  wallets: Int! # wallets that have ever deposited (received newly minted vault shares)
  holders: Int! # wallets holding any vault shares right now
  shareSupply: BigInt! # vault shares in existence (6 decimals)
  deposits: Int! # share mints
  withdrawals: Int! # share burns
  lastBlock: Int!
}

type Holder {
  id: ID! # wallet on Monad
  balance: BigInt! @index # vault shares (6 decimals)
  firstDepositDay: String # YYYY-MM-DD (UTC) of the wallet's first deposit
  firstDepositBlock: Int
  deposits: Int!
}

type DailyStat {
  id: ID! # YYYY-MM-DD (UTC)
  newWallets: Int! # wallets making their first deposit that day
  deposits: Int!
  sharesMinted: BigInt!
  sharesBurned: BigInt!
}
