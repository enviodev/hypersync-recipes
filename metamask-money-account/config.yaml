# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: metamask-money-account-indexer
description: Deposits, withdrawals and holders of MetaMask's Money Account vault (vmUSD) on Monad, with its share price and Aave position
contracts:
  - name: MoneyAccountVault
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 amount)
  - name: MoneyAccountAccountant
    events:
      # Veda AccountantWithYieldStreaming, emitted with the new share price on every deposit and rate update
      - event: ExchangeRateUpdated(uint256 newRate)
  - name: AaveMusdAToken
    events:
      # Aave v3 aToken events. Each carries the reserve's liquidity index, so scaled balances can be rebuilt.
      - event: Mint(address indexed caller, address indexed onBehalfOf, uint256 value, uint256 balanceIncrease, uint256 index)
      - event: Burn(address indexed from, address indexed target, uint256 value, uint256 balanceIncrease, uint256 index)
      - event: BalanceTransfer(address indexed from, address indexed to, uint256 value, uint256 index)
chains:
  - id: 143 # Monad, synced with HyperSync
    start_block: 78633433 # the vault's first Transfer (2 Jun 2026)
    contracts:
      - name: MoneyAccountVault
        # Veda BoringVault behind the Money Account ("mUSD Vault", vmUSD).
        # Listed as moneyAccountVaultConfig.boringVault in MetaMask's extension repo and as
        # MoneyAccountVault in Monad's protocols registry (monad-crypto/protocols, mainnet/metamask.jsonc).
        address: 0x1C8a336051D2024E318A229d01F9F6CF96efD316
      - name: MoneyAccountAccountant
        # moneyAccountVaultConfig.accountant in the same MetaMask config
        address: 0x98A45D90E81849a5743241d3ff765F9Fd788206a
      - name: AaveMusdAToken
        # aMonmUSD, Aave v3 on Monad (bgd-labs/aave-address-book, AaveV3Monad.sol). First event at block 84,974,169.
        address: 0xDBb2e1b6BC94328Df2662A1796AB6A23fCde3199
