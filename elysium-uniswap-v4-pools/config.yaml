# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: elysium-uniswap-v4-pools
description: Every Uniswap v4 pool created on Elysium (Kinetiq's Hyperliquid L2, chain 99901)
contracts:
  - name: PoolManager
    events:
      - event: Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)
chains:
  - id: 99901 # Elysium mainnet. Not on HyperSync yet, so HyperIndex syncs over RPC
    start_block: 256083 # PoolManager deployment block (3 Nov 2026)
    rpc:
      - url: ${ENVIO_ELYSIUM_RPC_URL:-https://rpc.elysium.kinetiq.xyz}
        for: sync
    contracts:
      - name: PoolManager
        # Uniswap v4 PoolManager on Elysium, from developers.uniswap.org/docs/protocols/v4/deployments
        address: 0xE2e105d3F7209A9DA11f83cCf3E7398a753823F1
