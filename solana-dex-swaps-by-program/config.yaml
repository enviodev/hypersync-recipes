# yaml-language-server: $schema=./node_modules/envio/svm.schema.json
name: solana-dex-swaps-by-program
description: Daily swap counts by Solana DEX program (Raydium, Orca, Meteora, Pump.fun) plus Jupiter routes.
ecosystem: svm
chains:
  - id: solana
    # One UTC day, 9 Nov 2026. Change both to index another window.
    start_slot: 467108373
    end_slot: 467510826
# Every program and discriminator below comes from the project's own repo or
# published IDL. Only swap instructions are listed: liquidity, fee, position
# and event-CPI (e445a52e51cb9a1d) instructions never match, so never count.
programs:
  - name: RaydiumAmmV4
    program_id: 675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8
    # Not Anchor: a one-byte tag (raydium-amm program/src/instruction.rs).
    instructions:
      - { name: swapBaseIn, discriminator: "0x09" }
      - { name: swapBaseOut, discriminator: "0x0b" }
      - { name: swapBaseInV2, discriminator: "0x10" }
      - { name: swapBaseOutV2, discriminator: "0x11" }
  - name: RaydiumClmm
    program_id: CAMMCzo5YL8w4VFF8KVHrK22GGUsp5VTaW7grrKgrWqK
    instructions:
      - { name: swap, discriminator: "0xf8c69e91e17587c8" }
      - { name: swapV2, discriminator: "0x2b04ed0b1ac91e62" }
      - { name: swapRouterBaseIn, discriminator: "0x457d73daf5baf2c4" }
